<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金海豚 · 游戏开发大赛热门看板</title>
  <link rel="shortcut icon" href="data:," />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="./styles.css?v=20260804j" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div>
          <h1>金海豚 · 游戏开发大赛热门看板</h1>
          <p class="sub">好游快爆 × 金海豚奖 · 试玩投票排行 · 全量作品 · 30分钟自动采集</p>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="theme-toggle" id="themeToggle" title="切换深浅色主题">🌙</button>
        <div class="status" id="statusPill">连接中…</div>
        <button type="button" class="btn" id="btnVote">给把把博弈王投票</button>
      </div>
    </header>

    <!-- KPI 总览 -->
    <section class="hero-panel">
      <div class="hero-head">
        <div>
          <p class="eyebrow">数据总览</p>
          <h2>参赛作品</h2>
          <p class="muted">全部作品热度实时排行</p>
        </div>
        <div class="kpi-row" id="overviewKpis"></div>
      </div>
    </section>

    <!-- 时间范围 + 作品热度走势 -->
    <section class="toolbar card" id="timebar">
      <div class="filters" style="margin-right:18px">
        <label>时间范围 <span class="range-hint" id="rangeHint"></span></label>
        <div class="seg" id="rangeSeg">
          <button type="button" data-range="24h" class="active">近24小时</button>
          <button type="button" data-range="7d">近7天</button>
          <button type="button" data-range="30d">近30天</button>
          <button type="button" data-range="all">全部</button>
        </div>
      </div>
      <div class="filters custom-range">
        <label>自定义范围</label>
        <div class="range-inputs">
          <input type="datetime-local" id="fromInput" />
          <span class="range-sep">至</span>
          <input type="datetime-local" id="toInput" />
          <button type="button" class="btn-sm" id="btnApplyRange">应用</button>
        </div>
      </div>
    </section>

    <section class="toolbar card" id="trendbar">
      <div class="trend-row">
        <label for="trendSearch">查看作品热度 / 排名走势</label>
        <div class="trend-input-row">
          <div class="trend-thumb" id="trendThumb" title="当前查看作品"></div>
          <input id="trendSearch" type="search" placeholder="输入作品名（默认榜首）" />
          <button type="button" id="btnViewTrend">查看走势</button>
        </div>
      </div>
    </section>

    <!-- 热度 + 排名走势双图 -->
    <section class="charts" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px">
      <article class="card chart-card">
        <div class="card-head">
          <h3 id="trendTitle">作品热度走势</h3>
          <span class="chip">整点快照趋势</span>
        </div>
        <div class="chart-wrap" style="height:300px">
          <canvas id="trendChart"></canvas>
        </div>
      </article>
      <article class="card chart-card">
        <div class="card-head">
          <h3 id="rankTitle">作品排名走势</h3>
          <span class="chip">数值越低排名越靠前（倒序）</span>
        </div>
        <div class="chart-wrap" style="height:300px">
          <canvas id="rankChart"></canvas>
        </div>
      </article>
    </section>

    <!-- 工具栏：搜索 + 类型筛选 + 排序 -->
    <section class="toolbar card">
      <div class="search-box">
        <label for="searchInput">搜索</label>
        <input id="searchInput" type="search" placeholder="作品名 / 简介 / 游戏ID" />
      </div>
      <div class="filters">
        <label>类型</label>
        <select id="typeSelect">
          <option value="all">全部类型</option>
          <option value="PC游戏">PC游戏</option>
          <option value="手游">手游</option>
          <option value="学生团队">学生团队</option>
          <option value="海峡之星">海峡之星</option>
          <option value="入围游戏">入围游戏</option>
        </select>
      </div>
      <div class="filters">
        <label>排序</label>
        <select id="sortSelect">
          <option value="zan:desc">热度 ↓</option>
          <option value="zan:asc">热度 ↑</option>
          <option value="name:asc">名称 A→Z</option>
          <option value="name:desc">名称 Z→A</option>
        </select>
      </div>
      <div class="snap-info" id="snapInfo">尚无快照</div>
    </section>

    <!-- 各榜单前十排名走势 -->
    <section class="top-rank-section">
      <div class="card-head" style="margin-bottom:12px">
        <h3>🏆 各榜单前十 · 排名走势</h3>
        <span class="chip">数值越低排名越靠前（倒序）</span>
      </div>
      <div class="top-rank-grid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">
        <article class="card chart-card">
          <div class="card-head">
            <h3>总榜前十 · 排名走势</h3>
            <span class="chip" id="overallTopCount">0 部</span>
          </div>
          <div class="chart-wrap" style="height:280px"><canvas id="topOverallChart"></canvas></div>
        </article>
        <article class="card chart-card">
          <div class="card-head">
            <h3>手游榜前十 · 排名走势</h3>
            <span class="chip" id="mobileTopCount">0 部</span>
          </div>
          <div class="chart-wrap" style="height:280px"><canvas id="topMobileChart"></canvas></div>
        </article>
        <article class="card chart-card">
          <div class="card-head">
            <h3>PC 榜前十 · 排名走势</h3>
            <span class="chip" id="pcTopCount">0 部</span>
          </div>
          <div class="chart-wrap" style="height:280px"><canvas id="topPcChart"></canvas></div>
        </article>
      </div>
    </section>

    <!-- 全量榜单 -->
    <section class="total-list">
      <article class="card list-card">
        <div class="card-head">
          <h3>🏆 作品数据榜单</h3>
          <span class="chip" id="totalCount">0 部</span>
        </div>
        <div class="table-wrap" style="max-height:700px">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>作品</th>
                <th>类型</th>
                <th class="num">热度</th>
                <th class="num">环比 <span class="th-hint">(较上一快照)</span></th>
              </tr>
            </thead>
            <tbody id="totalBody"></tbody>
          </table>
        </div>
      </article>
    </section>

  </div>
  <script src="./app.js?v=20260804j"></script>
</body>
</html>
