name: Deploy Jinhaitun Pages

on:
  schedule:
    # 每半小时抓取一次（北京 :05 和 :35），归到最近整点，确保不漏整点数据
    # :05 首抓当前整点，:35 补抓（防 :05 失败/延迟导致跳点）
    - cron: '5,35 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Crawl latest snapshot
        run: node scripts/crawl.js data/history.json
        continue-on-error: true

      - name: Build static data
        run: node scripts/build.js data/history.json data/

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/latest.json data/series.json
          git diff --cached --quiet || git commit -m "chore(data): update snapshots $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
